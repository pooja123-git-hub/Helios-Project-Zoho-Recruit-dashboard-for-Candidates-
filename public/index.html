<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Candidate Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div>
      <h1>Candidate Dashboard</h1>
    </div>
    <div class="hero-actions">
      <span class="pill" id="totalPill">Total records: –</span>
      <a class="btn-white" id="openRecruit" href="https://recruit.zoho.com/recruit/" target="_blank" rel="noopener">Open Candidates in Recruit</a>
    </div>
  </header>

  <main id="main" class="loading">
    <div class="banner" id="banner" hidden></div>

    <div class="datebar">
    <div class="seg" id="period" role="group" aria-label="Date">
      <button data-p="today">Today</button>
      <button data-p="week">Last week</button>
      <button data-p="month">Last month</button>
      <button data-p="custom">Custom</button>
    </div>
    <span class="custom-dates" id="customDates" hidden>
      <label>From <input type="date" id="fromDate"></label>
      <label>To <input type="date" id="toDate"></label>
    </span>
    <input type="search" id="search" class="search" placeholder="Search name, ID, role, location, job…" aria-label="Search candidates">
    </div>

    <div class="summaries" id="summaries">
      <div>
        <div class="section-title"><span>Candidate status</span></div>
        <div class="card summary"><div id="summary-status"></div></div>
      </div>
      <div>
        <div class="section-title"><span>Call status</span></div>
        <div class="card summary"><div id="summary-call"></div></div>
      </div>
      <div class="wide">
        <div class="section-title"><span>Round status</span></div>
        <div class="card summary"><div id="summary-round"></div></div>
      </div>
      <div>
        <div class="section-title"><span>Final decision</span></div>
        <div class="card summary"><div id="summary-final"></div></div>
      </div>
    </div>

    <div class="section-title">
      <span id="listTitle">Candidates</span>
      <button class="btn" id="exportBtn">⬇ Export CSV</button>
    </div>
    <div class="card"><div id="list"></div></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
